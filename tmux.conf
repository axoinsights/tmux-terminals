# tmux config for tmux-terminals's dedicated server (see src/pty-manager.ts). tmux is only a
# process-keeper here: it must be invisible to the agent TUIs and to xterm.js, so everything that
# would draw or intercept is turned off. Options use -q so an older tmux ignores what it lacks.

# Keep the server alive with zero sessions: it is started on demand and outlives restarts.
set -sq exit-empty off
set -sq escape-time 0

# No status bar, no tmux-owned scrollback: xterm.js keeps the scrollback.
set -gq status off
set -gq history-limit 0

# No prefix key, no default bindings: Ctrl-B etc. must reach the application.
set -gq prefix None
set -gq prefix2 None
unbind-key -a -T prefix
unbind-key -a -T root

# Pass-through so TUIs behave as in a bare pty: OSC 52 clipboard and other escape sequences
# reach xterm.js, focus events and extended keys too. Mouse stays at tmux's default; applications
# that request mouse tracking still get events.
set -gq set-clipboard on
set -gq allow-passthrough on
set -gq focus-events on
set -sq extended-keys on
set -gq default-terminal "tmux-256color"
set -asq terminal-features ",xterm-256color:RGB:clipboard:hyperlinks"
# Do not switch xterm.js to the alternate screen on attach: it has no scrollback there,
# which would kill scroll-up for plain-output TUIs.
set -asq terminal-overrides ",xterm*:smcup@:rmcup@"

# One client per session; follow whichever attached most recently.
set -gq window-size latest
set -gq aggressive-resize on
set -gq remain-on-exit off
