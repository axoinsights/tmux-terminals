# Sandbox option: tmux-terminals and its agents run inside this container, working in ./workspace.
# Published on 127.0.0.1 only; put `tailscale serve` (or another TLS proxy) in front for your phone.
services:
  tmux-terminals:
    build:
      context: .
      args:
        # Agent CLIs to install into the image (space separated npm packages), e.g.
        # "@anthropic-ai/claude-code @openai/codex". Leave empty for just a shell.
        NPM_AGENTS: ""
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8767:8767"
    volumes:
      - ./workspace:/workspace
      - tmux-terminals-config:/home/node/.config/tmux-terminals
    environment:
      # Optional: pin the access token instead of generating one (>= 16 chars).
      # TMUX_TERMINALS_TOKEN: ${TMUX_TERMINALS_TOKEN:-}
      TMUX_TERMINALS_CWD_PRESETS: /workspace
volumes:
  tmux-terminals-config:
