# Sandbox option: agent-terminal and its agents run inside this container, working in ./workspace.
# Published on 127.0.0.1 only; put `tailscale serve` (or another TLS proxy) in front for your phone.
services:
  agent-terminal:
    build:
      context: .
      args:
        # Agent CLIs to install into the image (space separated npm packages), e.g.
        # "@anthropic-ai/claude-code @openai/codex". Leave empty for just a shell.
        NPM_AGENTS: ""
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8767:8767"
    volumes:
      - ./workspace:/workspace
      - agent-terminal-config:/home/node/.config/agent-terminal
    environment:
      # Optional: pin the access token instead of generating one (>= 16 chars).
      # AGENT_TERMINAL_TOKEN: ${AGENT_TERMINAL_TOKEN:-}
      AGENT_TERMINAL_CWD_PRESETS: /workspace
volumes:
  agent-terminal-config:
