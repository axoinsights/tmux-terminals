      localStorage.setItem(RECENT_KEY, JSON.stringify(list));
    } catch (_) {}
  }
  function renderCwdPresets() {
    cwdPresets.innerHTML = "";
    const recents = loadRecentCwds();
    const all = [...recents, ...CWD_PRESETS.filter((p) => !recents.includes(p))];
    all.forEach((p) => {
      const b = document.createElement("button");
      b.textContent = p;
      if (recents.includes(p)) b.title = "Recently used";
      b.addEventListener("click", () => { spawnCwd.value = p; });
      cwdPresets.appendChild(b);
    });
  }

  function openSpawnDialog() {
    renderCwdPresets();
    spawnDialog.classList.add("open");
    spawnCwd.value = "";
    spawnCwd.focus();
  }
  function closeSpawnDialog() { spawnDialog.classList.remove("open"); }

  el("new-session-btn").addEventListener("click", openSpawnDialog);
  el("empty-new-btn").addEventListener("click", openSpawnDialog);
  el("spawn-cancel").addEventListener("click", closeSpawnDialog);
  spawnDialog.addEventListener("click", (e) => { if (e.target === spawnDialog) closeSpawnDialog(); });

  function renderAgentToggle() {
    const box = el("agent-toggle");
    box.innerHTML = "";
    for (const a of AGENTS) {
      const btn = document.createElement("button");
      btn.dataset.agent = a.id;
      btn.textContent = a.label;
      if (a.id === selectedAgent) btn.classList.add("selected");
      btn.addEventListener("click", () => { selectedAgent = a.id; renderAgentToggle(); syncResumeBox(); });
      box.appendChild(btn);
    }
    syncResumeBox();
  }
  function syncResumeBox() {
    const a = AGENTS.find((x) => x.id === selectedAgent);
    el("spawn-resume").style.display = a && a.canResume ? "" : "none";
    if (!(a && a.canResume)) el("spawn-resume-cb").checked = false;
  }

  el("spawn-go").addEventListener("click", () => {
    const cwd = spawnCwd.value.trim() || "~";
    send({ type: "pty_spawn", agent: selectedAgent, cwd, cols: 100, rows: 30, resume: el("spawn-resume-cb").checked });
    rememberCwd(cwd);
    el("spawn-resume-cb").checked = false; // a one-off choice, not a sticky default
    closeSpawnDialog();
  });

  // ─── Sidebar toggle (mobile) ─────────────────────────
  function setSidebarOpen(open) {
    sidebar.classList.toggle("mobile-hidden", !open);
    sidebarBackdrop.classList.toggle("show", open && window.innerWidth < 900);
  }
  el("hamburger").addEventListener("click", () => setSidebarOpen(sidebar.classList.contains("mobile-hidden")));
  sidebarBackdrop.addEventListener("click", () => setSidebarOpen(false));
  function closeSidebarOnMobile() {
    if (window.innerWidth < 900) setSidebarOpen(false);
  }

  // ─── Keyboard-aware viewport (mobile) ────────────────
  // 100dvh accounts for browser chrome (address bar) hiding/showing, but NOT
  // for the on-screen keyboard on most Android/Chrome versions — the layout
  // stays full-height and the keyboard just covers the bottom of it, burying
  // the key toolbar and often the input focus point. visualViewport tracks
  // the actually-visible area (keyboard excluded) so we can shrink #app to
  // match; `interactive-widget=resizes-content` (in the viewport meta tag)
  // does the same thing declaratively on browsers that support it — this is
  // the JS fallback for the rest (notably iOS Safari).
  function applyViewportHeight() {
    const vv = window.visualViewport;
    const h = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty("--app-height", h + "px");
    if (activeId) {
      const s = sessions.get(activeId);
      if (s) requestAnimationFrame(() => s.fit.fit());
    }
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", applyViewportHeight);
    window.visualViewport.addEventListener("scroll", applyViewportHeight);
  }
  applyViewportHeight();

  // ─── Voice input (dictate into the active terminal) ──────────────────
  // Dictation: only shown when the server has `transcribeUrl` configured. Records via
  // MediaRecorder, posts the blob to /api/transcribe, and types the returned text into the
  // active session exactly like a keystroke — no auto-Enter, so dictation
  // errors are visible and correctable before you actually run anything,
  // same as normal typing.
  let mediaRecorder = null, recordedChunks = [], micState = "idle", micMaxTimer = null;
  const micBtn = el("mic-btn");

  function stopRecording() {
    clearTimeout(micMaxTimer);
    if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  }

  micBtn.addEventListener("click", async () => {
    if (micState === "transcribing") return;
    if (micState === "recording") { stopRecording(); return; }
    if (!activeId) { showToast("Open a session first"); return; }
    if (!navigator.mediaDevices?.getUserMedia) { showToast("Mic not available (needs HTTPS)"); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recordedChunks = [];
      const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "audio/webm";
      mediaRecorder = new MediaRecorder(stream, { mimeType });
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach((t) => t.stop());
        micState = "transcribing";
        micBtn.classList.remove("recording");
        micBtn.classList.add("busy");
        transcribeRecording();
      };
      mediaRecorder.start();
      micState = "recording";
      micBtn.classList.add("recording");
      micMaxTimer = setTimeout(stopRecording, 60_000); // safety cap on a runaway recording
    } catch (err) {
      showToast(`Mic blocked: ${err.name || err.message || err}`);
    }
  });

  async function transcribeRecording() {
    try {
      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || "audio/webm" });
      const resp = await fetch("/api/transcribe", {
        method: "POST",
        headers: { "Content-Type": blob.type },
        body: blob,
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
      if (data.text && data.text.trim() && activeId) {
        sessions.get(activeId)?.resetMirror(true);
        send({ type: "pty_input", sessionId: activeId, data: data.text.trim() });
        sessions.get(activeId)?.term.focus();
      } else {
        showToast("No speech detected");
      }
    } catch (err) {
      showToast(`Transcribe failed: ${err.message || err}`);
    } finally {
      micState = "idle";
      micBtn.classList.remove("busy");
    }
  }

  // ─── Font size (shared across all sessions, persisted) ──────────────
  function applyFontSize() {
    localStorage.setItem("agent_terminal_font_size", String(fontSize));
    for (const s of sessions.values()) {
      s.term.options.fontSize = fontSize;
      s.fit.fit();
    }
  }
  el("font-smaller").addEventListener("click", () => {
    fontSize = Math.max(FONT_MIN, fontSize - 1);
    applyFontSize();
  });
  el("font-larger").addEventListener("click", () => {
    fontSize = Math.min(FONT_MAX, fontSize + 1);
    applyFontSize();
  });

  // ─── Swipe gestures (mobile): left/right switches sessions, up/down
  // scrolls the terminal ──────────────────────────────────────────────
  // Claude Code and Pi both enable terminal mouse-tracking (they're TUIs
  // that scroll their own output/history), so a touchscreen has no native
  // way to "wheel scroll" them — touch-dragging xterm's DOM viewport does
  // nothing while a mouse-tracking app owns the alt-screen. The fix:
  // translate vertical drag into synthetic `wheel` events dispatched on
  // xterm's own element, which already has the correct logic wired up —
  // it forwards a real mouse-wheel report to the child process when mouse
  // tracking is on, or scrolls the native DOM scrollback when it's off.
  // This reuses xterm's own handling rather than reimplementing the mouse
  // reporting protocol.
  //
  // A gesture is classified once (after ~8px of movement) as horizontal
  // (session switch, fires once on release) or vertical (continuous
  // scroll, fires per touchmove) so the two never fight each other.
  (function setupSwipe() {
    let sx = 0, sy = 0, lastY = 0, st = 0, tracking = false, mode = null; // mode: null | "h" | "v"
    termContainer.addEventListener("touchstart", (e) => {
      if (e.touches.length !== 1) { tracking = false; return; }
      sx = e.touches[0].clientX; sy = lastY = e.touches[0].clientY; st = Date.now();
      tracking = true; mode = null;
    }, { passive: true });

    termContainer.addEventListener("touchmove", (e) => {
      if (!tracking || e.touches.length !== 1) return;
      const t = e.touches[0];
      const dxTotal = t.clientX - sx, dyTotal = t.clientY - sy;
      if (!mode) {
        if (Math.abs(dxTotal) < 8 && Math.abs(dyTotal) < 8) return; // not enough movement yet
        mode = Math.abs(dyTotal) > Math.abs(dxTotal) ? "v" : "h";
      }
      if (mode !== "v") return; // horizontal case resolves at touchend below
      const entry = activeId && sessions.get(activeId);
      // Don't hijack a long-press-then-drag text selection (the standard
      // mobile way to select text, which is also mostly-vertical motion)
      // as a scroll gesture — that broke Copy entirely, since preventDefault
      // here also suppresses the browser's native selection-handle drag.
      if (entry && entry.term.hasSelection()) return;
      e.preventDefault(); // stop native scroll from double-applying alongside our synthetic wheel
      const target = entry && entry.term.element;
      if (target) {
        const deltaY = lastY - t.clientY; // finger up -> positive -> "scroll down/forward", matching natural touch panning
        target.dispatchEvent(new WheelEvent("wheel", { deltaY: deltaY * 2.2, deltaMode: 0, bubbles: true, cancelable: true }));
      }
      lastY = t.clientY;
    }, { passive: false });

    termContainer.addEventListener("touchend", (e) => {
      if (!tracking) return;
      tracking = false;
      if (mode === "v") { mode = null; return; }
      const t = e.changedTouches[0];
      const dx = t.clientX - sx, dy = t.clientY - sy, dt = Date.now() - st;
      mode = null;
      if (dt > 400 || Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.8) return;
      const ids = displayOrder();
      if (ids.length < 2 || !activeId) return;
      const idx = ids.indexOf(activeId);
      const nextIdx = dx < 0 ? (idx + 1) % ids.length : (idx - 1 + ids.length) % ids.length;
      activate(ids[nextIdx]);
    }, { passive: true });
  })();

  // ─── Copy / paste (mobile clipboard is otherwise painful to reach) ──
  // With the compose bar open the keyboard belongs to it: don't pull focus back into xterm's textarea.
  const composeBar = el("compose-bar"), composeInput = el("compose-input");
  const refocus = (term) => { if (composeBar.classList.contains("open")) composeInput.focus(); else term.focus(); };

  el("copy-btn").addEventListener("click", async () => {
    if (!activeId) return;
    const s = sessions.get(activeId);
    const text = s && s.term.getSelection();
    if (!text) { showToast("Select text first (Select button) or use Screen"); return; }
    showToast((await copyText(text)) ? "Copied" : "Copy blocked by browser");
  });

  // Text of the rows currently on screen (not the scrollback), right-trimmed, trailing blank rows dropped.
  function screenText(term) {
    const b = term.buffer.active, lines = [];
    for (let y = b.viewportY; y < b.viewportY + term.rows; y++) {
      const l = b.getLine(y);
      lines.push(l ? l.translateToString(true).replace(/\s+$/, "") : "");
    }
    while (lines.length && !lines[lines.length - 1]) lines.pop();
    return lines.join("\n");
  }
  el("copy-screen-btn").addEventListener("click", async () => {
    if (!activeId) return;
    const s = sessions.get(activeId);
    const text = s && screenText(s.term);
    if (!text) { showToast("Screen is empty"); return; }
    showToast((await copyText(text)) ? "Screen copied" : "Copy blocked by browser");
  });

  // Select mode: TUIs that enable mouse tracking swallow plain drags. xterm
  // only starts a local selection when Shift is held, so while this toggle
  // is on, re-dispatch each mousedown with shiftKey forced.
  let selectMode = false;
  const selectBtn = el("select-btn");
  selectBtn.addEventListener("click", () => {
    selectMode = !selectMode;
    selectBtn.classList.toggle("active", selectMode);
    showToast(selectMode ? "Select mode ON: drag to select text" : "Select mode off");
    const e = activeId && sessions.get(activeId);
    if (e) e.term.focus();
  });
  let redispatching = false;
  termContainer.addEventListener("mousedown", (ev) => {
    if (!selectMode || redispatching || ev.shiftKey || ev.button !== 0) return;
    ev.stopImmediatePropagation();
    ev.preventDefault();
    redispatching = true;
    try {
      ev.target.dispatchEvent(new MouseEvent("mousedown", {
        bubbles: true, cancelable: true, view: window, shiftKey: true,
        clientX: ev.clientX, clientY: ev.clientY, screenX: ev.screenX, screenY: ev.screenY,
        button: 0, buttons: ev.buttons, detail: ev.detail,
      }));
    } finally { redispatching = false; }
  }, { capture: true });
  let pasteBusy = false;
  el("paste-btn").addEventListener("click", async () => {
    if (!activeId) return;
    // Guard against a double-fired tap/click pasting twice.
    if (pasteBusy) return;
    pasteBusy = true;
    setTimeout(() => { pasteBusy = false; }, 600);
    const text = await readClipboard();
    const e = sessions.get(activeId);
    // term.paste(): bracketed paste when the app asked for it, newlines as \r, and it goes out through onData like typing
    // (the paste de-dup in term.onData only acts after a real DOM paste event, which this doesn't raise).
    if (text && e) { e.resetMirror(true); e.term.paste(text); }
    else if (text === "") showToast("Clipboard empty");
    else if (text === null) showToast("Paste blocked on non-HTTPS: use Ctrl+Shift+V");
    if (e) refocus(e.term);
  });

  // ─── Mobile key toolbar ──────────────────────────────
  document.querySelectorAll("#key-toolbar button").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (!activeId) return;
      const entry = sessions.get(activeId);
      if (!entry) return;
      entry.resetMirror(true); // keys sent directly bypass the Android input mirror
      if (btn.dataset.ctrl) {
        const code = btn.dataset.ctrl.toUpperCase().charCodeAt(0) - 64;
        send({ type: "pty_input", sessionId: activeId, data: String.fromCharCode(code) });
      } else if (btn.dataset.key === "Escape") {
        send({ type: "pty_input", sessionId: activeId, data: "\x1b" });
      } else if (btn.dataset.key === "Tab") {
        send({ type: "pty_input", sessionId: activeId, data: "\t" });
      } else if (btn.dataset.key === "Enter") {
        send({ type: "pty_input", sessionId: activeId, data: "\r" });
      } else if (btn.dataset.key === "ArrowUp") {
        send({ type: "pty_input", sessionId: activeId, data: "\x1b[A" });
      } else if (btn.dataset.key === "ArrowDown") {
        send({ type: "pty_input", sessionId: activeId, data: "\x1b[B" });
      } else if (btn.dataset.key === "ArrowRight") {
        send({ type: "pty_input", sessionId: activeId, data: "\x1b[C" });
      } else if (btn.dataset.key === "ArrowLeft") {
        send({ type: "pty_input", sessionId: activeId, data: "\x1b[D" });
      }
      refocus(entry.term);
    });
    // Keep the on-screen keyboard (and the compose box's caret) where it is when a toolbar button is tapped.
    const keepFocus = (ev) => ev.preventDefault();
    btn.addEventListener("pointerdown", keepFocus);
    btn.addEventListener("mousedown", keepFocus);
  });

  // ─── Compose bar ─────────────────────────────────────
  // A normal textarea in front of the pty: the keyboard's suggestions, autocorrect and swipe typing edit it freely and
  // only the final text is sent (on Enter / Send), so a replaced word never reaches the shell half-typed.
  const composeBtn = el("compose-btn");
  const xtermTextareas = () => termContainer.querySelectorAll("textarea.xterm-helper-textarea");
  function sizeCompose() {
    composeInput.style.height = "auto";
    composeInput.style.height = Math.min(composeInput.scrollHeight + 2, 4 * 21 + 18) + "px"; // 1 to 4 lines
    const s = activeId && sessions.get(activeId);
    if (s) requestAnimationFrame(() => s.fit.fit());
  }
  function setCompose(on, focus) {
    composeBar.classList.toggle("open", on);
    composeBtn.classList.toggle("active", on);
    composeBtn.setAttribute("aria-pressed", String(on));
    // inputmode=none: tapping the terminal must not raise the keyboard for xterm's hidden textarea while compose is in use.
    xtermTextareas().forEach((t) => (on ? t.setAttribute("inputmode", "none") : t.removeAttribute("inputmode")));
    try { localStorage.setItem("terminal.compose", on ? "1" : "0"); } catch (_) { /* private mode */ }
    sizeCompose();
    if (on && focus) composeInput.focus();
    else if (!on) { const s = activeId && sessions.get(activeId); if (s) s.term.focus(); }
  }
  composeBtn.addEventListener("click", () => setCompose(!composeBar.classList.contains("open"), true));
  // Tapping a terminal while compose is open: redirect focus to the compose box.
  termContainer.addEventListener("focusin", (ev) => {
    if (!composeBar.classList.contains("open") || !ev.target.classList || !ev.target.classList.contains("xterm-helper-textarea")) return;
    ev.target.setAttribute("inputmode", "none");
    composeInput.focus();
  });
  function sendCompose() {
    if (!activeId) return;
    const entry = sessions.get(activeId);
    if (!entry) return;
    // ESC would let the text close a bracketed paste early and run what follows, so typed text never carries one.
    const text = composeInput.value.replace(/\x1b/g, "");
    let data;
    if (!text) data = "\r";
    else if (text.includes("\n")) {
      const lines = text.replace(/\r?\n/g, "\r");
      data = (entry.term.modes && entry.term.modes.bracketedPasteMode ? "\x1b[200~" + lines + "\x1b[201~" : lines) + "\r";
    } else data = text + "\r";
    send({ type: "pty_input", sessionId: activeId, data });
    composeInput.value = "";
    sizeCompose();
    composeInput.focus();
  }
  let enterKeydownAt = 0;
  composeInput.addEventListener("keydown", (ev) => {
    if (ev.isComposing || ev.keyCode === 229) return;
    if (ev.key === "Enter") {
      enterKeydownAt = Date.now();
      if (!ev.shiftKey) { ev.preventDefault(); sendCompose(); }
    } else if (ev.key === "Backspace" && !composeInput.value && activeId) {
      ev.preventDefault();
      send({ type: "pty_input", sessionId: activeId, data: "\x7f" });
    }
  });
  // Soft keyboards often skip keydown (keyCode 229) and only fire beforeinput.
  composeInput.addEventListener("beforeinput", (ev) => {
    if (ev.inputType === "insertLineBreak" && Date.now() - enterKeydownAt > 80) { ev.preventDefault(); sendCompose(); }
    else if (ev.inputType === "deleteContentBackward" && !composeInput.value && activeId) {
      ev.preventDefault();
      send({ type: "pty_input", sessionId: activeId, data: "\x7f" });
    }
  });
  composeInput.addEventListener("input", sizeCompose);
  el("compose-send").addEventListener("click", sendCompose);
  el("compose-send").addEventListener("pointerdown", (ev) => ev.preventDefault());
  el("compose-send").addEventListener("mousedown", (ev) => ev.preventDefault());
  try { if (localStorage.getItem("terminal.compose") === "1") setCompose(true, false); } catch (_) { /* no storage */ }

  window.addEventListener("resize", () => {
    if (splitMode) {
      for (const id of splitIds) { const s = id && sessions.get(id); if (s) s.fit.fit(); }
    } else if (activeId) {
      const s = sessions.get(activeId);
      if (s) s.fit.fit();
    }
  });
  window.addEventListener("orientationchange", () => {
    // Rotation resize events land a beat after the event fires on some
    // Android builds — a single rAF isn't reliably late enough.
    setTimeout(applyViewportHeight, 300);
  });

  // ─── Search scrollback ────────────────────────────────────────────
  const searchBar = el("search-bar");
  const searchInput = el("search-input");
  const searchCount = el("search-count");
  const searchBtn = el("search-btn");

  function openSearch() {
    if (!activeId) return;
    searchBar.classList.add("open");
    searchBtn.classList.add("active");
    searchInput.focus();
    searchInput.select();
  }
  function closeSearch() {
    searchBar.classList.remove("open");
    searchBtn.classList.remove("active");
    searchCount.textContent = "";
    const s = activeId && sessions.get(activeId);
    if (s) { s.search.clearDecorations(); s.term.focus(); }
  }
  function activeSearch() {
    const s = activeId && sessions.get(activeId);
    return s ? s.search : null;
  }
  // resultIndex/resultCount (and onDidChangeResults firing at all) only get
  // computed when a `decorations` option is passed — without it the addon
  // just finds the one next/previous match and skips the full-buffer scan.
  const SEARCH_OPTS = {
    decorations: {
      matchBackground: "#3a3a4a", matchBorder: "#6c8cff", matchOverviewRuler: "#6c8cff",
      activeMatchBackground: "#6c8cff", activeMatchBorder: "#ffffff", activeMatchColorOverviewRuler: "#ffffff",
    },
  };
  searchBtn.addEventListener("click", () => searchBar.classList.contains("open") ? closeSearch() : openSearch());
  searchInput.addEventListener("input", () => {
    const s = activeSearch();
    if (s && searchInput.value) s.findNext(searchInput.value, { ...SEARCH_OPTS, incremental: true });
    else if (s) s.clearDecorations();
  });
  searchInput.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.preventDefault(); closeSearch(); return; }
    if (e.key === "Enter") {
      e.preventDefault();
      const s = activeSearch();
      if (!s || !searchInput.value) return;
      e.shiftKey ? s.findPrevious(searchInput.value, SEARCH_OPTS) : s.findNext(searchInput.value, SEARCH_OPTS);
    }
  });
  el("search-next").addEventListener("click", () => { const s = activeSearch(); if (s && searchInput.value) s.findNext(searchInput.value, SEARCH_OPTS); });
  el("search-prev").addEventListener("click", () => { const s = activeSearch(); if (s && searchInput.value) s.findPrevious(searchInput.value, SEARCH_OPTS); });
  el("search-close").addEventListener("click", closeSearch);

  // ─── Keyboard shortcuts (desktop) ─────────────────────────────────
  // Ctrl/Cmd+Shift+<key> deliberately — plain Ctrl+<letter> is real
  // terminal input (Ctrl+C/D/U/R/W/A/E/K/... are all live readline/shell
  // control characters), so anything that steals a bare Ctrl+letter combo
  // would break normal shell editing. Shift added to every binding here
  // sidesteps that class of conflict entirely.
  document.addEventListener("keydown", (e) => {
    const mod = e.ctrlKey || e.metaKey;
    if (!mod || !e.shiftKey) return;
    const key = e.key.toLowerCase();
    if (key === "c") {
      // Chrome binds Ctrl+Shift+C to DevTools inspect; claim it for copy.
      e.preventDefault();
      const s = activeId && sessions.get(activeId);
      const t = s && s.term.getSelection();
      if (t) copyText(t).then((ok) => showToast(ok ? "Copied" : "Copy blocked by browser"));
      return;
    }
    if (key === "t") { e.preventDefault(); openSpawnDialog(); }
    else if (key === "w") { e.preventDefault(); if (activeId) closeSession(activeId); }
    else if (key === "f") { e.preventDefault(); searchBar.classList.contains("open") ? closeSearch() : openSearch(); }
    else if (/^[1-9]$/.test(e.key)) {
      e.preventDefault();
      const ids = displayOrder();
      const target = ids[Number(e.key) - 1];
      if (target) { if (splitMode) exitSplit(); activate(target); }
    }
  }, { capture: true });

  // Server-provided settings (agents, groups, presets, dictation), then the WebSocket.
  const agentLabel = (id) => { const a = AGENTS.find((x) => x.id === id); return a ? a.label : id || "Session"; };
  const agentColor = (id) => { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h} 65% 58%)`; };
  fetch("/api/config", { credentials: "same-origin" })
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status))))
    .then((c) => {
      HOME = c.home || ""; AGENTS = c.agents || []; GROUPS = c.groups || []; CWD_PRESETS = c.cwdPresets && c.cwdPresets.length ? c.cwdPresets : ["~"];
      selectedAgent = AGENTS.length ? AGENTS[0].id : "";
      el("mic-btn").hidden = !c.transcribe;
      renderAgentToggle();
    })
    .catch(() => showToast("Could not load settings (reload the page)"))
    .finally(connect);
})();
</script>
</body>
</html>
